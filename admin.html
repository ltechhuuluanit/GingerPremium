<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản Trị - Ginger Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       ADMIN PANEL – Ginger Premium CMS
       ============================================================ */
    :root {
      --gold: #d4af37;
      --gold-dim: rgba(212,175,55,.12);
      --dark: #0d0d0d;
      --surface: #181818;
      --surface2: #222;
      --border: rgba(255,255,255,.07);
      --text: #eee;
      --muted: #888;
      --danger: #e74c3c;
      --success: #2ecc71;
      --radius: 12px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', 'Times New Roman', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---- LOGIN SCREEN ---- */
    .login-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 50%, #0d0d0d 100%);
      display: flex; align-items: center; justify-content: center;
      z-index: 10000;
      transition: opacity .5s, visibility .5s;
    }
    .login-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 400px; max-width: 92vw;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      text-align: center;
    }
    .login-box .logo-icon { font-size: 3rem; margin-bottom: 8px; }
    .login-box h1 { font-family:'Playfair Display',serif; font-size:1.6rem; color:var(--gold); margin-bottom:6px; }
    .login-box p.sub { color:var(--muted); font-size:.85rem; margin-bottom:28px; }

    .login-field {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      border-radius: 10px; color: #fff; font-size: .95rem;
      margin-bottom: 14px; outline: none; transition: border-color .2s;
    }
    .login-field:focus { border-color: var(--gold); }
    .login-field::placeholder { color: var(--muted); }

    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--gold), #c9a227);
      color: #111; font-weight: 700; font-size: 1rem;
      border: none; border-radius: 10px; cursor: pointer;
      transition: transform .15s, box-shadow .2s;
      margin-top: 6px;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,175,55,.3); }
    .login-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

    .login-error {
      color: var(--danger); font-size: .85rem;
      margin-top: 12px; display: none;
    }
    .login-error.show { display: block; }

    /* ---- ADMIN LAYOUT ---- */
    .admin-wrapper { display: none; }
    .admin-wrapper.visible { display: block; }

    .admin-topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px);
    }
    .admin-topbar h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; color: var(--gold);
    }
    .admin-topbar .top-actions { display: flex; gap: 10px; align-items: center; }

    .admin-body { display: flex; min-height: calc(100vh - 64px); }

    .admin-sidebar {
      width: 240px; min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 10px;
    }

    .sidebar-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 12px 16px;
      background: transparent; border: none; border-radius: 10px;
      color: var(--muted); font-size: .9rem; cursor: pointer;
      text-align: left; margin-bottom: 4px;
      transition: all .2s;
    }
    .sidebar-btn:hover { background: var(--gold-dim); color: var(--gold); }
    .sidebar-btn.active { background: var(--gold-dim); color: var(--gold); font-weight: 600; border-left: 3px solid var(--gold); }
    .sidebar-btn .emoji { font-size: 1.1rem; width: 24px; text-align: center; }

    .admin-main {
      flex: 1; padding: 32px;
      max-width: 960px;
    }

    /* ---- PANELS ---- */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn .3s ease; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .panel h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; color: var(--gold);
      margin-bottom: 24px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* ---- FORM ELEMENTS ---- */
    .fg { margin-bottom: 18px; }
    .fg label { display: block; font-size: .85rem; color: var(--gold); margin-bottom: 6px; font-weight: 500; }
    .fg input, .fg textarea, .fg select {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: .9rem; outline: none;
      transition: border-color .2s;
    }
    .fg input:focus, .fg textarea:focus { border-color: var(--gold); }
    .fg textarea { resize: vertical; min-height: 70px; }

    .fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* ---- BUTTONS ---- */
    .btn {
      padding: 10px 22px; border: none; border-radius: 8px;
      font-size: .9rem; font-weight: 600; cursor: pointer;
      transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-gold { background: var(--gold); color: #111; }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,175,55,.3); }
    .btn-outline { background: rgba(255,255,255,.06); color: #ccc; border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger { background: rgba(231,76,60,.15); color: var(--danger); border: 1px solid rgba(231,76,60,.3); }
    .btn-danger:hover { background: rgba(231,76,60,.25); }
    .btn-sm { padding: 7px 14px; font-size: .8rem; }

    /* ---- CARD ITEMS ---- */
    .item-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px; margin-bottom: 16px;
      position: relative;
      transition: border-color .2s;
    }
    .item-card:hover { border-color: rgba(212,175,55,.2); }
    .item-card .card-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .item-card .card-head h3 { font-size: 1rem; color: #fff; }
    .item-card .card-head .badge {
      font-size: .7rem; padding: 3px 10px;
      background: var(--gold-dim); color: var(--gold);
      border-radius: 20px;
    }

    /* ---- STATUS TOAST ---- */
    .toast {
      position: fixed; bottom: 30px; right: 30px;
      padding: 14px 24px; border-radius: 12px;
      font-size: .9rem; font-weight: 500;
      transform: translateY(100px); opacity: 0;
      transition: all .4s cubic-bezier(.17,.67,.45,1.2);
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: rgba(46,204,113,.15); border: 1px solid var(--success); color: var(--success); }
    .toast.error { background: rgba(231,76,60,.15); border: 1px solid var(--danger); color: var(--danger); }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 768px) {
      .admin-body { flex-direction: column; }
      .admin-sidebar { width: 100%; min-width: unset; display: flex; overflow-x: auto; padding: 10px; gap: 4px; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar-btn { white-space: nowrap; min-width: auto; margin-bottom: 0; }
      .admin-main { padding: 20px; }
      .fg-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ============================================================
     1. LOGIN SCREEN
     ============================================================ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo-icon">🔐</div>
    <h1>Ginger Premium</h1>
    <p class="sub">Đăng nhập vào bảng quản trị website</p>
    <form id="loginForm" autocomplete="off">
      <input class="login-field" type="text" id="loginUser" placeholder="Tên đăng nhập" required autocomplete="username" />
      <input class="login-field" type="password" id="loginPass" placeholder="Mật khẩu" required autocomplete="current-password" />
      <button class="login-btn" type="submit" id="loginBtn">Đăng Nhập</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ============================================================
     2. ADMIN PANEL
     ============================================================ -->
<div class="admin-wrapper" id="adminWrapper">

  <!-- TOP BAR -->
  <div class="admin-topbar">
    <h1>🛠️ Bảng Quản Trị</h1>
    <div class="top-actions">
      <button class="btn btn-gold" id="btnSave">💾 Lưu Thay Đổi</button>
      <a class="btn btn-outline" href="index.html" target="_blank">👁️ Xem Website</a>
      <button class="btn btn-outline" id="btnLogout">🚪 Đăng Xuất</button>
    </div>
  </div>

  <div class="admin-body">

    <!-- SIDEBAR -->
    <nav class="admin-sidebar">
      <button class="sidebar-btn active" data-panel="home"><span class="emoji">🏠</span> Trang Chủ</button>
      <button class="sidebar-btn" data-panel="about"><span class="emoji">📖</span> Giới Thiệu</button>
      <button class="sidebar-btn" data-panel="products"><span class="emoji">🎁</span> Sản Phẩm</button>
      <button class="sidebar-btn" data-panel="blogs"><span class="emoji">✍️</span> Blog</button>
      <button class="sidebar-btn" data-panel="news"><span class="emoji">📰</span> Tin Tức</button>
      <button class="sidebar-btn" data-panel="jobs"><span class="emoji">💼</span> Tuyển Dụng</button>
      <button class="sidebar-btn" data-panel="contacts"><span class="emoji">📞</span> Liên Hệ</button>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="admin-main">

      <!-- ========== TRANG CHỦ ========== -->
      <section class="panel active" id="panel-home">
        <h2>🏠 Quản Trị Trang Chủ</h2>
        <div class="fg">
          <label>Tiêu đề Hero (Main Headline)</label>
          <input type="text" id="home-heroTitle" />
        </div>
        <div class="fg">
          <label>Mô tả phụ (Subtitle)</label>
          <textarea id="home-heroSubtitle" rows="3"></textarea>
        </div>
        <div class="fg-row">
          <div class="fg">
            <label>Đường dẫn ảnh Banner</label>
            <input type="text" id="home-heroImage" />
          </div>
          <div class="fg">
            <label>Nội dung nút CTA</label>
            <input type="text" id="home-ctaText" />
          </div>
        </div>
      </section>

      <!-- ========== GIỚI THIỆU ========== -->
      <section class="panel" id="panel-about">
        <h2>📖 Quản Trị Giới Thiệu</h2>
        <div class="fg">
          <label>Tiêu đề</label>
          <input type="text" id="about-title" />
        </div>
        <div class="fg">
          <label>Mô tả phụ</label>
          <textarea id="about-subtitle" rows="3"></textarea>
        </div>
        <div class="fg-row">
          <div class="fg">
            <label>Tên người sáng lập</label>
            <input type="text" id="about-founderName" />
          </div>
          <div class="fg">
            <label>Chức danh</label>
            <input type="text" id="about-founderTitle" />
          </div>
        </div>
        <div class="fg">
          <label>Trích dẫn của người sáng lập</label>
          <textarea id="about-founderQuote" rows="3"></textarea>
        </div>
        <div class="fg">
          <label>Ghi chú thêm</label>
          <textarea id="about-founderNote" rows="2"></textarea>
        </div>
      </section>

      <!-- ========== SẢN PHẨM ========== -->
      <section class="panel" id="panel-products">
        <h2>🎁 Quản Trị Sản Phẩm</h2>
        <div style="margin-bottom:20px;">
          <button class="btn btn-gold btn-sm" id="btnAddProduct">+ Thêm Sản Phẩm Mới</button>
        </div>
        <div id="productsList"></div>
      </section>

      <!-- ========== BLOG ========== -->
      <section class="panel" id="panel-blogs">
        <h2>✍️ Quản Trị Blog</h2>
        <div style="margin-bottom:20px;">
          <button class="btn btn-gold btn-sm" id="btnAddBlog">+ Thêm Bài Viết Mới</button>
        </div>
        <div id="blogsList"></div>
      </section>

      <!-- ========== TIN TỨC ========== -->
      <section class="panel" id="panel-news">
        <h2>📰 Quản Trị Tin Tức</h2>
        <div style="margin-bottom:20px;">
          <button class="btn btn-gold btn-sm" id="btnAddNews">+ Thêm Bài PR Mới</button>
        </div>
        <div id="newsList"></div>
      </section>

      <!-- ========== TUYỂN DỤNG ========== -->
      <section class="panel" id="panel-jobs">
        <h2>💼 Quản Trị Tuyển Dụng</h2>
        <div style="margin-bottom:20px;">
          <button class="btn btn-gold btn-sm" id="btnAddJob">+ Đăng Tin Tuyển Dụng</button>
        </div>
        <div id="jobsList"></div>
      </section>

      <!-- ========== LIÊN HỆ ========== -->
      <section class="panel" id="panel-contacts">
        <h2>📞 Quản Trị Liên Hệ</h2>
        <div class="fg">
          <label>Số điện thoại Hotline</label>
          <input type="text" id="contacts-phone" />
        </div>
        <div class="fg">
          <label>Email hỗ trợ</label>
          <input type="text" id="contacts-email" />
        </div>
        <div class="fg">
          <label>Địa chỉ Showroom</label>
          <input type="text" id="contacts-address" />
        </div>
      </section>

    </main>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ==============================================================
   GINGER PREMIUM – ADMIN CMS
   ==============================================================*/

// ---- JSONBin Configuration ----
const JSONBIN_MASTER_KEY = "$2a$10$Evr7NfnqJIFnwRNOsbjqW.0xTLmqmdDeO7P40YkcVg8c95K1ehgvC";
const JSONBIN_BIN_ID    = "6a1e90ebf5f4af5e29abf94a";
const JSONBIN_API       = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

// ---- Admin credentials ----
const ADMIN_USER = "admin";
const ADMIN_PASS = "admin";   // tk: admin / mk: admin

// ---- Global state ----
let siteData = {};

/* ==============================================================
   AUTH
   ============================================================== */
const $login   = document.getElementById("loginScreen");
const $admin   = document.getElementById("adminWrapper");
const $loginForm = document.getElementById("loginForm");
const $loginErr  = document.getElementById("loginError");

// Check existing session
if (sessionStorage.getItem("gp_admin_logged") === "1") {
  $login.classList.add("hidden");
  $admin.classList.add("visible");
  bootAdmin();
}

$loginForm.addEventListener("submit", e => {
  e.preventDefault();
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value;

  if (user === ADMIN_USER && pass === ADMIN_PASS) {
    sessionStorage.setItem("gp_admin_logged", "1");
    $login.classList.add("hidden");
    $admin.classList.add("visible");
    $loginErr.classList.remove("show");
    bootAdmin();
  } else {
    $loginErr.textContent = "❌ Tên đăng nhập hoặc mật khẩu không đúng!";
    $loginErr.classList.add("show");
  }
});

document.getElementById("btnLogout").addEventListener("click", () => {
  sessionStorage.removeItem("gp_admin_logged");
  location.reload();
});

/* ==============================================================
   TOAST
   ============================================================== */
function toast(msg, type = "success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove("show"), 4000);
}

/* ==============================================================
   TAB SWITCHING
   ============================================================== */
document.querySelectorAll(".sidebar-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sidebar-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`panel-${btn.dataset.panel}`).classList.add("active");
  });
});

/* ==============================================================
   BOOT ADMIN – Load data then fill forms
   ============================================================== */
async function bootAdmin() {
  toast("⏳ Đang tải dữ liệu...", "success");
  await loadData();
  fillAllForms();
  toast("✅ Đã tải dữ liệu thành công!", "success");
}

/* ==============================================================
   LOAD DATA (JSONBin → fallback local file)
   ============================================================== */
async function loadData() {
  // 1) Try JSONBin
  try {
    const res = await fetch(JSONBIN_API, {
      method: "GET",
      headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
    });
    if (res.ok) {
      const json = await res.json();
      siteData = json.record || json;
      return;
    }
  } catch (e) {
    console.warn("JSONBin load failed, trying local file...", e);
  }

  // 2) Fallback: local file
  try {
    const res = await fetch("assets/data/site_data.json");
    if (res.ok) {
      siteData = await res.json();
    }
  } catch (e) {
    console.error("Local file load also failed", e);
    siteData = {};
  }
}

/* ==============================================================
   SAVE DATA → JSONBin (real persistence!)
   ============================================================== */
async function saveData() {
  // Collect from forms first
  collectAllForms();

  try {
    const res = await fetch(JSONBIN_API, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_MASTER_KEY
      },
      body: JSON.stringify(siteData)
    });

    if (res.ok) {
      toast("✅ Đã lưu thành công lên server!", "success");
    } else {
      const err = await res.json();
      throw new Error(err.message || "HTTP " + res.status);
    }
  } catch (e) {
    console.error("Save failed:", e);
    // Fallback: save to localStorage
    localStorage.setItem("gp_site_data_backup", JSON.stringify(siteData));
    toast("⚠️ Lưu online thất bại. Đã lưu tạm trong trình duyệt.", "error");
  }
}

document.getElementById("btnSave").addEventListener("click", saveData);

/* ==============================================================
   FILL ALL FORMS from siteData
   ============================================================== */
function fillAllForms() {
  // Home
  if (siteData.home) {
    setVal("home-heroTitle", siteData.home.heroTitle);
    setVal("home-heroSubtitle", siteData.home.heroSubtitle);
    setVal("home-heroImage", siteData.home.heroImage);
    setVal("home-ctaText", siteData.home.ctaText);
  }

  // About
  if (siteData.about) {
    setVal("about-title", siteData.about.title);
    setVal("about-subtitle", siteData.about.subtitle);
    setVal("about-founderName", siteData.about.founderName);
    setVal("about-founderTitle", siteData.about.founderTitle);
    setVal("about-founderQuote", siteData.about.founderQuote);
    setVal("about-founderNote", siteData.about.founderNote);
  }

  // Contacts
  if (siteData.contacts) {
    setVal("contacts-phone", siteData.contacts.phone);
    setVal("contacts-email", siteData.contacts.email);
    setVal("contacts-address", siteData.contacts.address);
  }

  // Lists
  renderProducts();
  renderBlogs();
  renderNews();
  renderJobs();
}

function setVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val || "";
}

/* ==============================================================
   COLLECT ALL FORMS back into siteData
   ============================================================== */
function collectAllForms() {
  siteData.home = {
    heroTitle:    document.getElementById("home-heroTitle").value,
    heroSubtitle: document.getElementById("home-heroSubtitle").value,
    heroImage:    document.getElementById("home-heroImage").value,
    ctaText:      document.getElementById("home-ctaText").value
  };

  siteData.about = siteData.about || {};
  siteData.about.title        = document.getElementById("about-title").value;
  siteData.about.subtitle     = document.getElementById("about-subtitle").value;
  siteData.about.founderName  = document.getElementById("about-founderName").value;
  siteData.about.founderTitle = document.getElementById("about-founderTitle").value;
  siteData.about.founderQuote = document.getElementById("about-founderQuote").value;
  siteData.about.founderNote  = document.getElementById("about-founderNote").value;

  siteData.contacts = {
    phone:   document.getElementById("contacts-phone").value,
    email:   document.getElementById("contacts-email").value,
    address: document.getElementById("contacts-address").value
  };

  // Products / Blogs / News / Jobs – already updated via onchange handlers
}

/* ==============================================================
   RENDER: PRODUCTS
   ============================================================== */
function renderProducts() {
  const container = document.getElementById("productsList");
  container.innerHTML = "";
  if (!siteData.products || !siteData.products.length) {
    container.innerHTML = '<p style="color:var(--muted)">Chưa có sản phẩm nào. Nhấn "Thêm Sản Phẩm Mới" để bắt đầu.</p>';
    return;
  }

  siteData.products.forEach((p, i) => {
    container.innerHTML += `
      <div class="item-card">
        <div class="card-head">
          <h3>#${i+1} – ${p.name || "Chưa đặt tên"}</h3>
          <div>
            <span class="badge">${p.badge || ""}</span>
            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${i})">🗑️ Xóa</button>
          </div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Tên sản phẩm</label>
            <input type="text" value="${esc(p.name)}" onchange="siteData.products[${i}].name=this.value" /></div>
          <div class="fg"><label>Giá</label>
            <input type="text" value="${esc(p.price)}" onchange="siteData.products[${i}].price=this.value" /></div>
        </div>
        <div class="fg-row">
          <div class="fg"><label>Ảnh (đường dẫn)</label>
            <input type="text" value="${esc(p.image)}" onchange="siteData.products[${i}].image=this.value" /></div>

/* ==============================================================
   HELPERS
   ============================================================== */
function esc(str) {
  if (!str) return "";
  return String(str).replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
